[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ante"
version = "0.0.1"
description = "Notebooks, experiments, and model training for early prediction of addictive player behavior in responsible gambling."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "ipython",
    "jupyterlab",
    "loguru",
    "matplotlib",
    "notebook",
    "numpy",
    "pandas",
    "python-dotenv",
    "scikit-learn",
    "tqdm",
    "typer",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
include = ["ante*"]

[tool.ruff]
line-length = 99
src = ["ante"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["ante"]
force-sort-within-sections = true
